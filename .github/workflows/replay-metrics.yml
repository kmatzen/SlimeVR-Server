name: replay-metrics

# Runs the skeleton replay regression suite and publishes its metrics table.
#
# The suite itself also runs as part of the normal test tasks. This workflow
# exists to make the *numbers* visible on every PR rather than only a pass/fail:
# most changes to the tracking stack are trade-offs -- less foot slide for more
# latency, less floor clip for more jitter -- and a reviewer needs to see the
# trade, which a bare green check hides.

on:
  push:
    branches: [main]
    paths:
      - 'server/core/src/main/java/dev/slimevr/tracking/**'
      - 'server/core/src/main/java/dev/slimevr/metrics/**'
      - 'server/core/src/test/java/dev/slimevr/replay/**'
      - 'server/core/src/test/resources/replay-baseline.txt'
      - 'server/core/src/test/resources/corpus/**'
      - '.github/workflows/replay-metrics.yml'
  pull_request:
    paths:
      - 'server/core/src/main/java/dev/slimevr/tracking/**'
      - 'server/core/src/main/java/dev/slimevr/metrics/**'
      - 'server/core/src/test/java/dev/slimevr/replay/**'
      - 'server/core/src/test/resources/replay-baseline.txt'
      - 'server/core/src/test/resources/corpus/**'
      - '.github/workflows/replay-metrics.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run replay suite
        id: replay
        run: |
          set -o pipefail
          ./gradlew :server:core:test --tests 'dev.slimevr.replay.*' \
            --info --console=plain 2>&1 | tee replay-output.txt

      - name: Publish metrics table
        if: always()
        run: |
          # Gradle prefixes test stdout with "  HH:MM:SS [INFO] " under --info,
          # so patterns anchored at the start of the line never match the
          # metrics tables. Strip the prefix once, here, rather than trying to
          # write every pattern below around it.
          sed -E 's/^[[:space:]]*[0-9]{2}:[0-9]{2}:[0-9]{2} \[[A-Z]+\] //' \
            replay-output.txt > replay-metrics.txt

          {
            echo '## Skeleton replay metrics'
            echo
            echo '```'
            grep -E '^(metric +baseline|(stand|squat|walk-in-place|lean)[/+])' replay-metrics.txt \
              | grep -v 'via .pfr' \
              || echo 'no metrics table found'
            echo '```'
            echo
            echo '## Corpus metrics'
            echo
            echo 'Real `.pfr` recordings, replayed through the same metrics and'
            echo 'baseline as the synthetic sequences. Empty until captures are'
            echo 'committed -- see `server/core/src/test/resources/corpus/README.md`.'
            echo
            echo '```'
            grep -E '^corpus' replay-metrics.txt || echo 'no corpus output found'
            echo '```'
            echo
            echo '<details><summary>.pfr round trip vs the synthetic baseline</summary>'
            echo
            echo 'With no recordings committed, the corpus path is exercised by'
            echo 'replaying a synthetic sequence out through PfrIO and back, and'
            echo 'requiring it to reproduce its own committed synthetic baseline.'
            echo 'A nonzero delta means the format or the corpus driver is lossy.'
            echo
            echo '```'
            grep -E 'via .pfr' replay-metrics.txt || echo 'no round-trip table found'
            echo '```'
            echo '</details>'
            echo
            echo '## Clock-skew recovery'
            echo
            echo 'What per-tracker time skew costs, and how much of it'
            echo '`TimeAlignment` recovers. `reference` is the same motion with'
            echo 'every tracker equally delayed -- the pose alignment is trying'
            echo 'to reach.'
            echo
            echo '```'
            grep -E '^SKEW ' replay-metrics.txt || echo 'no skew table found'
            echo '```'
            echo
            echo '<details><summary>Replay determinism</summary>'
            echo
            echo '```'
            grep -E 'drift between identical runs|squat floor clip|squat foot slide' \
              replay-metrics.txt || echo 'none reported'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-metrics
          path: |
            replay-output.txt
            server/core/build/reports/tests/test/**
          if-no-files-found: warn
